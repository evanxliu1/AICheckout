<!-- Sanitized structure observed on the live unauthenticated Best Buy cart, 2026-09-25.
Only headings and the amount table are retained; no account, tracking or page scripts. -->
<main>
  <h1>Your cart is empty</h1>
  <div data-testid="order-summary__container">
    <h2 id="cart-order-summary">Order Summary</h2>
    <table aria-label="Order Summary" data-testid="order-summary__price-summary-table">
      <tbody><tr><th scope="row"><span>Total</span></th><td>$0.00</td></tr></tbody>
    </table>
  </div>
</main>
