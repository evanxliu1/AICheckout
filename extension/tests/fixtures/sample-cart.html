<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your cart</title>
<!-- Neutral sample cart for the store images (milestone 15.6): a fictional store with no retailer branding,
layout or logo, served in memory at a cart URL so the badge content script runs. The order summary
is the generic cart reader's input; the badge reads only the amounts. -->
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f3f4f6}
main{max-width:880px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
h1{grid-column:1/-1;margin:0;font-size:24px}
.muted{color:#6b7280;font-size:14px}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px}
.item{display:flex;gap:12px;align-items:center;padding:8px 0}
.item+.item{border-top:1px solid #e5e7eb}
.thumb{width:56px;height:56px;border-radius:6px;background:#e5e7eb;flex:none}
.item p{margin:0;font-size:14px}
h2{margin:0 0 8px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;padding:6px 0}
td{text-align:right;padding:6px 0}
tr.total th,tr.total td{font-weight:700;border-top:1px solid #e5e7eb;padding-top:10px}
</style>
</head>
<body>
<main>
  <h1>Your cart</h1>
  <section class="box">
    <p class="muted">Sample cart · 2 items</p>
    <div class="item"><div class="thumb" aria-hidden="true"></div><p>Sample item<br><span class="muted">Qty 1</span></p></div>
    <div class="item"><div class="thumb" aria-hidden="true"></div><p>Another sample item<br><span class="muted">Qty 2</span></p></div>
  </section>
  <section class="box">
    <h2>Order summary</h2>
    <table>
      <tr><th scope="row">Subtotal</th><td>$92.59</td></tr>
      <tr><th scope="row">Estimated tax</th><td>$7.41</td></tr>
      <tr class="total"><th scope="row">Total</th><td>$100.00</td></tr>
    </table>
  </section>
</main>
</body>
</html>
