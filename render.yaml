# Render Blueprint: catalog API + review app served from one Node process.
# Secrets (SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) are entered in the Render dashboard.
services:
  - type: web
    name: ai-checkout-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@ai-checkout/api --workspace=@ai-checkout/review
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: HOST
        value: 0.0.0.0
      - key: REVIEW_DIST_DIR
        value: apps/review/dist
      - key: CURATION_ADAPTER
        value: disabled
      - key: CURATION_ALLOW_METERED
        value: 'false'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
